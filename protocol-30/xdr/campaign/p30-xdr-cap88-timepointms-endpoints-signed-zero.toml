# Protocol 30 structural StellarValue vector for CAP-88's
# STELLAR_VALUE_SIGNED_MS arm (discriminant 3) at the unsigned
# TimePointMs lower endpoint (zero: 0).
#
# The official stellar-xdr 30.0.0 Rust types encoded a typed StellarValue
# with tx_set_hash = Hash([0x11; 32]), close_time = 0,
# close_time_ms = 0, no upgrades, and the SignedMs arm.
# CAP-88 requires close_time == floor(close_time_ms / 1000); at zero
# close_time is exactly 0. The independent Python decoder test asserts
# both values and this relationship. It also checks the signature fields
# and re-encodes the bytes separately from the Rust source.
#
# Generation expression:
#
#   StellarValue {
#       tx_set_hash: Hash([0x11; 32]),
#       close_time: TimePoint(0),
#       upgrades: VecM::default(),
#       ext: StellarValueExt::SignedMs(StellarValueSignedMs {
#           close_time_ms: TimePointMs(0),
#           lc_value_signature: LedgerCloseValueSignature {
#               node_id: NodeId(PublicKey::PublicKeyTypeEd25519(
#                   Uint256([0x66; 32]))),
#               signature: Signature(vec![0x55; 64].try_into().unwrap()),
#           },
#       }),
#   }
#
# Crate: stellar-xdr 30.0.0; rustc 1.99.1 (58cf8f9c3 2026-10-13);
# generated 2026-11-20 (UTC).
#
# The node id and 64-byte signature are deterministic sentinels. They are not
# cryptographically verified and do not represent a valid consensus vote.
# This fixture proves XDR structure only, not consensus validity or complete
# Protocol 30 compatibility.
