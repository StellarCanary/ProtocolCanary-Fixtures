name: release-pack

on:
  push:
    tags:
      - "fixtures-p28-v*"
      - "fixtures-p29-v*"
      - "fixtures-p30-v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (MAJOR.MINOR.PATCH)"
        required: true
        type: string
      protocol:
        description: "Protocol pack to build"
        required: true
        type: choice
        options:
          - "28"
          - "29"
          - "30"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack: ${{ steps.selection.outputs.pack }}
      version: ${{ steps.selection.outputs.version }}
      verified: ${{ steps.selection.outputs.verified }}
      tag: ${{ steps.selection.outputs.tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"

      - name: Select pack and validate release ref
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          DISPATCH_PROTOCOL: ${{ inputs.protocol }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 tools/release/select_pack.py \
              --event "$EVENT_NAME" \
              --protocol "$DISPATCH_PROTOCOL" \
              --version "$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            python3 tools/release/select_pack.py \
              --event "$EVENT_NAME" \
              --tag "$RELEASE_TAG" \
              --ref "$EVENT_REF" \
              --sha "$EVENT_SHA" \
              --main-ref refs/remotes/origin/main >> "$GITHUB_OUTPUT"
          fi

      - name: Build run-1 in clean directory
        env:
          PACK: ${{ steps.selection.outputs.pack }}
          VERSION: ${{ steps.selection.outputs.version }}
          VERIFIED: ${{ steps.selection.outputs.verified }}
        run: |
          mkdir -p /tmp/build1
          VERIFY_ARGS=()
          if [ "$VERIFIED" = "true" ]; then VERIFY_ARGS+=(--verified); fi
          python3 tools/pack/pack.py "$PACK" --version "$VERSION" --output-dir /tmp/build1 "${VERIFY_ARGS[@]}"

      - name: Build run-2 in separate clean directory
        env:
          PACK: ${{ steps.selection.outputs.pack }}
          VERSION: ${{ steps.selection.outputs.version }}
          VERIFIED: ${{ steps.selection.outputs.verified }}
        run: |
          mkdir -p /tmp/build2
          VERIFY_ARGS=()
          if [ "$VERIFIED" = "true" ]; then VERIFY_ARGS+=(--verified); fi
          python3 tools/pack/pack.py "$PACK" --version "$VERSION" --output-dir /tmp/build2 "${VERIFY_ARGS[@]}"

      - name: Assert bit-for-bit identical hashes across independent builds
        env:
          VERSION: ${{ steps.selection.outputs.version }}
        run: |
          ARCHIVE="protocolcanary-fixtures-${VERSION}.tar.gz"
          echo "Comparing /tmp/build1/$ARCHIVE and /tmp/build2/$ARCHIVE"
          cmp "/tmp/build1/$ARCHIVE" "/tmp/build2/$ARCHIVE"

          HASH1=$(sha256sum "/tmp/build1/$ARCHIVE" | awk '{print $1}')
          HASH2=$(sha256sum "/tmp/build2/$ARCHIVE" | awk '{print $1}')
          echo "Build 1 SHA-256: $HASH1"
          echo "Build 2 SHA-256: $HASH2"

          if [ "$HASH1" != "$HASH2" ]; then
            echo "ERROR: Release build is not reproducible; SHA-256 digests diverge!" >&2
            exit 1
          fi

          echo "Verified bit-for-bit reproducible archive hash: $HASH1"

      - name: Verify archive integrity against pack schema and digest
        env:
          VERSION: ${{ steps.selection.outputs.version }}
        run: python3 tools/pack/verify_archive.py "/tmp/build1/protocolcanary-fixtures-${VERSION}.tar.gz"

      - name: Generate release manifest and SHA-256 checksums
        env:
          VERSION: ${{ steps.selection.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          ARCHIVE="/tmp/build1/protocolcanary-fixtures-${VERSION}.tar.gz"
          MANIFEST="/tmp/build1/protocolcanary-fixtures-${VERSION}.manifest.json"
          CHECKSUM="/tmp/build1/protocolcanary-fixtures-${VERSION}.sha256"
          python3 tools/release/manifest.py "$ARCHIVE" \
            --revision "$REVISION" \
            --output "$MANIFEST" \
            --sha256-file "$CHECKSUM"

      - name: Verify archive against manifest and checksum
        env:
          VERSION: ${{ steps.selection.outputs.version }}
        run: |
          ARCHIVE="/tmp/build1/protocolcanary-fixtures-${VERSION}.tar.gz"
          MANIFEST="/tmp/build1/protocolcanary-fixtures-${VERSION}.manifest.json"
          CHECKSUM="/tmp/build1/protocolcanary-fixtures-${VERSION}.sha256"
          python3 tools/pack/verify_archive.py "$ARCHIVE" --manifest "$MANIFEST"
          (cd /tmp/build1 && sha256sum -c "$(basename "$CHECKSUM")")

      - name: Generate deterministic release changelog from fragments
        env:
          PACK: ${{ steps.selection.outputs.pack }}
          VERSION: ${{ steps.selection.outputs.version }}
        run: |
          PROTOCOL="${PACK#protocol-}"
          python3 tools/release/changelog.py \
            --protocol "$PROTOCOL" \
            --version "$VERSION" \
            --output "/tmp/build1/protocolcanary-fixtures-${VERSION}.changelog.md"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: |
            /tmp/build1/protocolcanary-fixtures-${{ steps.selection.outputs.version }}.tar.gz
            /tmp/build1/protocolcanary-fixtures-${{ steps.selection.outputs.version }}.manifest.json
            /tmp/build1/protocolcanary-fixtures-${{ steps.selection.outputs.version }}.sha256
            /tmp/build1/protocolcanary-fixtures-${{ steps.selection.outputs.version }}.changelog.md
          if-no-files-found: error
          retention-days: 1

  attest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fixtures-p')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist

      - name: Attest archive and manifest
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            dist/protocolcanary-fixtures-${{ needs.build.outputs.version }}.tar.gz
            dist/protocolcanary-fixtures-${{ needs.build.outputs.version }}.manifest.json
            dist/protocolcanary-fixtures-${{ needs.build.outputs.version }}.changelog.md

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"

      - name: Revalidate exact published release ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SELECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 tools/release/select_pack.py \
            --event "$EVENT_NAME" \
            --tag "$RELEASE_TAG" \
            --ref "$EVENT_REF" \
            --sha "$EVENT_SHA" \
            --main-ref refs/remotes/origin/main
          case "$RELEASE_TAG" in
            *-v"$SELECTED_VERSION") ;;
            *) echo "Release tag version does not match the built artifact" >&2; exit 1 ;;
          esac

      - name: Download verified release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist

      - name: Reverify release candidate
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ARCHIVE="dist/protocolcanary-fixtures-${VERSION}.tar.gz"
          MANIFEST="dist/protocolcanary-fixtures-${VERSION}.manifest.json"
          CHECKSUM="dist/protocolcanary-fixtures-${VERSION}.sha256"
          python3 tools/pack/verify_archive.py "$ARCHIVE" --manifest "$MANIFEST"
          (cd dist && sha256sum -c "$(basename "$CHECKSUM")")

      - name: Regenerate and compare release changelog
        env:
          PACK: ${{ needs.build.outputs.pack }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PROTOCOL="${PACK#protocol-}"
          python3 tools/release/changelog.py \
            --protocol "$PROTOCOL" \
            --version "$VERSION" \
            --output /tmp/release-changelog.md
          cmp /tmp/release-changelog.md \
            "dist/protocolcanary-fixtures-${VERSION}.changelog.md"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/protocolcanary-fixtures-${VERSION}.tar.gz" \
            "dist/protocolcanary-fixtures-${VERSION}.manifest.json" \
            "dist/protocolcanary-fixtures-${VERSION}.sha256" \
            "dist/protocolcanary-fixtures-${VERSION}.changelog.md" \
            --repo "$GITHUB_REPOSITORY"
