# Protocol 28 / ScVal: an absent (null) `SCV_MAP` round-trips.
#
# What this tests:
# the `SCV_MAP` arm with the pointer flag set to 0: the absent map. The encoding is discriminant 17 followed by a 4-byte 0 and no entry count or entries.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `typedef SCMapEntry SCMap<>;` -- Stellar-contract.x line 243; `case SCV_MAP: SCMap *map;` -- lines 300-301.
#   * `enum SCValType` -- Stellar-contract.x lines 26-81; `union SCVal` -- lines 254-316.
#
# Why it matters:
# v28.0 already has a present-but-empty map fixture. The absent pointer is a distinct encoding: it stops after the flag, while an empty map adds an entry count of 0. A decoder that collapsed null onto empty would lose that difference and read the wrong number of bytes.
#
# Expected result and where it comes from: kind = "roundtrip" means a
# decoder must accept this value and re-encoding it must reproduce
# value_base64 byte for byte, not merely an equal value. The payload was
# produced by a program that builds the typed value with the official
# `stellar-xdr 28.0.1` crate (features base64 and alloc -- the crate version
# Protocol-Canary's canary-xdr pins for Protocol 28) and serialises it
# with to_xdr_base64(Limits::none()), never hand-assembled. Generation
# expression, recorded verbatim:
#
#   ScVal::Map(None)
#
# Crate: stellar-xdr 28.0.1; rustc 1.100.0 (3acc79c0c 2026-11-05); generated 2026-11-20 (UTC). The same program asserted the crate's own round trip: from_xdr_base64 returned Ok and re-encoding the decoded value reproduced the encoding exactly.
#
# Is it deterministic: Yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes, which are quoted
# in full in the fixture.
#
# Every payload byte is a synthetic structural value, not a capture of a real network object: the fixed bytes are arbitrary sentinels chosen by the generator, no account key, contract id, signature or secret key is a real one, and nothing here was observed on a network.
#
# The XDR definition cited below is the pinned file, not a moving branch.
#
