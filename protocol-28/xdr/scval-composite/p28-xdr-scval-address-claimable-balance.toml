# Protocol 28 / ScVal: a claimable-balance `SCV_ADDRESS` round-trips (structural only).
#
# What this tests:
# the `SCV_ADDRESS` arm carrying `ScAddress::ClaimableBalance(ClaimableBalanceId::ClaimableBalanceIdTypeV0(Hash([0x44; 32])))`: the SC_ADDRESS_TYPE_CLAIMABLE_BALANCE discriminant, the ClaimableBalanceIDType V0 discriminant and a 32-byte hash.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `enum SCAddressType` -- Stellar-contract.x lines 179-190; `union SCAddress` -- lines 206-222.
#   * `enum ClaimableBalanceIDType { CLAIMABLE_BALANCE_ID_TYPE_V0 = 0 };` -- Stellar-types.x lines 142-145; `union ClaimableBalanceID` -- lines 147-151.
#   * `enum SCValType` -- Stellar-contract.x lines 26-81; `union SCVal` -- lines 254-316.
#
# Why it matters:
# The claimable-balance arm is a union nested inside the SCAddress union. It must be decoded by both discriminants; treating it as a bare hash would consume the wrong number of bytes and lose the balance-id type.
#
# Expected result and where it comes from: kind = "roundtrip" means a
# decoder must accept this value and re-encoding it must reproduce
# value_base64 byte for byte, not merely an equal value. The payload was
# produced by a program that builds the typed value with the official
# `stellar-xdr 28.0.1` crate (features base64 and alloc -- the crate version
# Protocol-Canary's canary-xdr pins for Protocol 28) and serialises it
# with to_xdr_base64(Limits::none()), never hand-assembled. Generation
# expression, recorded verbatim:
#
#   ScVal::Address(ScAddress::ClaimableBalance(ClaimableBalanceId::ClaimableBalanceIdTypeV0(Hash([0x44; 32]))))
#
# Crate: stellar-xdr 28.0.1; rustc 1.100.0 (3acc79c0c 2026-11-05); generated 2026-11-20 (UTC). The same program asserted the crate's own round trip: from_xdr_base64 returned Ok and re-encoding the decoded value reproduced the encoding exactly.
#
# Is it deterministic: Yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes, which are quoted
# in full in the fixture.
#
# Every payload byte is a synthetic structural value, not a capture of a real network object: the 0x44-filled hash is an arbitrary sentinel, not the id of any real claimable balance, and nothing here was observed on a network. This claimable-balance ScVal is explicitly structural: this fixture does not claim that the Soroban host accepts it as a contract argument or return value.
