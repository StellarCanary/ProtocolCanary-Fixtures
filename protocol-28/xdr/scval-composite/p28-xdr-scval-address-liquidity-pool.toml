# Protocol 28 / ScVal: a liquidity-pool `SCV_ADDRESS` round-trips (structural only).
#
# What this tests:
# the `SCV_ADDRESS` arm carrying `ScAddress::LiquidityPool(PoolId(Hash([0x55; 32])))`: the SC_ADDRESS_TYPE_LIQUIDITY_POOL discriminant and a 32-byte PoolID.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `enum SCAddressType` -- Stellar-contract.x lines 179-190; `union SCAddress` -- lines 206-222.
#   * `typedef Hash PoolID; // SHA256(LiquidityPoolParameters)` -- Stellar-types.x line 140; `typedef opaque Hash[32];` -- line 8.
#   * `enum SCValType` -- Stellar-contract.x lines 26-81; `union SCVal` -- lines 254-316.
#
# Why it matters:
# The liquidity-pool arm is a fixed 32-byte PoolID with no nested discriminant or length prefix, unlike the account arm. A decoder that omitted this arm would reject a defined v28.0 address type outright.
#
# Expected result and where it comes from: kind = "roundtrip" means a
# decoder must accept this value and re-encoding it must reproduce
# value_base64 byte for byte, not merely an equal value. The payload was
# produced by a program that builds the typed value with the official
# `stellar-xdr 28.0.1` crate (features base64 and alloc -- the crate version
# Protocol-Canary's canary-xdr pins for Protocol 28) and serialises it
# with to_xdr_base64(Limits::none()), never hand-assembled. Generation
# expression, recorded verbatim:
#
#   ScVal::Address(ScAddress::LiquidityPool(PoolId(Hash([0x55; 32]))))
#
# Crate: stellar-xdr 28.0.1; rustc 1.100.0 (3acc79c0c 2026-11-05); generated 2026-11-20 (UTC). The same program asserted the crate's own round trip: from_xdr_base64 returned Ok and re-encoding the decoded value reproduced the encoding exactly.
#
# Is it deterministic: Yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes, which are quoted
# in full in the fixture.
#
# Every payload byte is a synthetic structural value, not a capture of a real network object: the 0x55-filled hash is an arbitrary sentinel, not the id of any real liquidity pool, and nothing here was observed on a network. This liquidity-pool ScVal is explicitly structural: this fixture does not claim that the Soroban host accepts it as a contract argument or return value.
#
# The XDR definition cited below is the pinned file, not a moving branch.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-types.x

