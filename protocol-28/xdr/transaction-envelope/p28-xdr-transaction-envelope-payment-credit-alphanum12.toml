# Protocol 28 / TransactionEnvelope: a Payment with an AlphaNum12 issued asset round-trips.
#
# The pack's Payment fixtures use only the native Asset arm. The
# independent codec already supports both issued-asset arms, and
# `ASSET_TYPE_CREDIT_ALPHANUM12` is the fixed twelve-byte code plus a
# 32-byte issuer key. This fixture adds a Payment that pays a synthetic
# AlphaNum12 asset, exercising the wider code and issuer fields.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `union TransactionEnvelope` — Stellar-transaction.x lines 1001-1010;
#   * `struct TransactionV1Envelope` — Stellar-transaction.x lines 967-973;
#   * `struct Transaction` — Stellar-transaction.x lines 932-965;
#   * `struct Operation` and `struct PaymentOp` — Stellar-transaction.x
#     lines 653-719 and 92-97;
#   * `union Asset`, `enum AssetType`, `typedef opaque AssetCode12[12]`,
#     `struct AlphaNum12` — Stellar-ledger-entries.x lines 19-30, 55-66
#     and Stellar-transaction.x lines 88-90;
#   * `union PublicKey` and `enum PublicKeyType` — Stellar-types.x lines
#     29-57;
#   * `struct DecoratedSignature` — Stellar-transaction.x lines 33-37.
#
# Why it matters: an AlphaNum12 code is eight bytes longer than an
# AlphaNum4 code, so a decoder that assumed one fixed asset-code width
# would read the issuer and amount at the wrong offset. This fixture proves
# the arm round-trips: decoding and re-encoding must reproduce exactly
# these bytes.
#
# The payload was produced by a program that builds the typed value with
# the official `stellar-xdr` 28.0.1 crate (features base64 and alloc, the
# crate version Protocol-Canary's canary-xdr pins for Protocol 28; rustc
# 1.100.0 (0ef1bc386 2026-11-09)) and serialises it, never hand-assembled.
# Generation expression, recorded verbatim:
#
#   TransactionEnvelope::Tx(TransactionV1Envelope {
#       tx: Transaction {
#           source_account: MuxedAccount::Ed25519(Uint256([0x78; 32])),
#           fee: 100_000,
#           seq_num: SequenceNumber(6_100_007),
#           cond: Preconditions::None,
#           memo: Memo::None,
#           operations: vec![Operation {
#               source_account: None,
#               body: OperationBody::Payment(PaymentOp {
#                   destination: MuxedAccount::Ed25519(Uint256([0x79; 32])),
#                   asset: Asset::CreditAlphanum12(AlphaNum12 {
#                       asset_code: AssetCode12(*b"ABCDEFGHIJKL"),
#                       issuer: AccountId(PublicKey::PublicKeyTypeEd25519(
#                           Uint256([0x7a; 32]),
#                       )),
#                   }),
#                   amount: 4_006,
#               }),
#           }].try_into().unwrap(),
#           ext: TransactionExt::V0,
#       },
#       signatures: vec![DecoratedSignature {
#           hint: SignatureHint([0x7b; 4]),
#           signature: Signature(BytesM::try_from(vec![0x7b; 64]).unwrap()),
#       }].try_into().unwrap(),
#   }).to_xdr_base64(Limits::none())
#
# Crate: stellar-xdr 28.0.1; rustc 1.100.0 (0ef1bc386 2026-11-09);
# generated 2026-11-20 (UTC). The same crate round-tripped the value:
# TransactionEnvelope::from_xdr_base64 followed by to_xdr reproduced the
# 248-byte encoding exactly, byte for byte.
#
# Every payload byte is a synthetic structural value, not a capture of a
# real network object: the 0x78-filled source account, 0x79-filled
# destination and 0x7a-filled issuer are not real accounts, the 0x7b-filled
# signature hint and signature are not a signature made by any key, and the
# fee, sequence number, asset code and amount are arbitrary fixed values.
# The asset is not issued, funded or present on any network. The signature
# does not sign anything and was never observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-transaction.x

