# Protocol 28 / TransactionEnvelope: the PRECOND_TIME arm with explicit time bounds round-trips.
#
# `TransactionEnvelope`'s v1 `Transaction` carries a `Preconditions` union.
# Every existing Protocol 28 envelope fixture uses PRECOND_NONE, so this
# fixture covers PRECOND_TIME: an explicit minimum and maximum `TimePoint`
# (uint64 seconds) in the order the definition declares.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `union TransactionEnvelope` — Stellar-transaction.x lines 1001-1010;
#   * `struct TransactionV1Envelope` — Stellar-transaction.x lines 967-973;
#   * `struct Transaction` — Stellar-transaction.x lines 932-965;
#   * `union Preconditions` and `enum PreconditionType` —
#     Stellar-transaction.x lines 832-847;
#   * `struct TimeBounds` — Stellar-transaction.x lines 787-791;
#   * `typedef uint64 TimePoint` — Stellar-types.x line 14;
#   * `struct Operation` and `struct PaymentOp` — Stellar-transaction.x
#     lines 653-719 and 92-97;
#   * `struct DecoratedSignature` — Stellar-transaction.x lines 33-37.
#
# Why it matters: the two bounds are adjacent uint64 fields. A decoder that
# read them as 32-bit values, swapped them, or treated the union as having a
# single bound would misread the precondition while still decoding a
# PRECOND_NONE envelope correctly. This fixture proves the arm round-trips:
# decoding and re-encoding must reproduce exactly these bytes.
#
# The payload was produced by a program that builds the typed value with
# the official `stellar-xdr` 28.0.1 crate (features base64 and alloc, the
# crate version Protocol-Canary's canary-xdr pins for Protocol 28; rustc
# 1.100.0 (0ef1bc386 2026-11-09)) and serialises it, never hand-assembled.
# Generation expression, recorded verbatim:
#
#   TransactionEnvelope::Tx(TransactionV1Envelope {
#       tx: Transaction {
#           source_account: MuxedAccount::Ed25519(Uint256([0x71; 32])),
#           fee: 100_000,
#           seq_num: SequenceNumber(6_100_005),
#           cond: Preconditions::Time(TimeBounds {
#               min_time: TimePoint(1_700_000_000),
#               max_time: TimePoint(1_700_086_400),
#           }),
#           memo: Memo::None,
#           operations: vec![Operation {
#               source_account: None,
#               body: OperationBody::Payment(PaymentOp {
#                   destination: MuxedAccount::Ed25519(Uint256([0x72; 32])),
#                   asset: Asset::Native,
#                   amount: 4_004,
#               }),
#           }].try_into().unwrap(),
#           ext: TransactionExt::V0,
#       },
#       signatures: vec![DecoratedSignature {
#           hint: SignatureHint([0x73; 4]),
#           signature: Signature(BytesM::try_from(vec![0x73; 64]).unwrap()),
#       }].try_into().unwrap(),
#   }).to_xdr_base64(Limits::none())
#
# The interval is increasing: min_time 1_700_000_000 and max_time
# 1_700_086_400, one day later. It is a fixed synthetic interval, not a
# live ledger observation; this fixture does not claim the transaction is
# valid for any current ledger time.
#
# Crate: stellar-xdr 28.0.1; rustc 1.100.0 (0ef1bc386 2026-11-09);
# generated 2026-11-20 (UTC). The same crate round-tripped the value:
# TransactionEnvelope::from_xdr_base64 followed by to_xdr reproduced the
# 216-byte encoding exactly, byte for byte.
#
# Every payload byte is a synthetic structural value, not a capture of a
# real network object: the 0x71-filled source account and 0x72-filled
# destination are not real accounts, the 0x73-filled signature hint and
# signature are not a signature made by any key, and the fee, sequence
# number, time bounds and amount are arbitrary fixed values. The signature
# does not sign anything and was never observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-transaction.x

