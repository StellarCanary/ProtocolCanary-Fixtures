# Protocol 28 / LedgerEntry: a trustline with an undefined asset type is rejected.
#
# Complements p28-xdr-ledger-entry-trustline.toml: a decoder that accepts a
# truncated or mis-tagged entry is as much of a compatibility break as one
# that rejects a valid one, because a partial entry would be stored or read as
# if it were whole.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `union TrustLineAsset` — Stellar-ledger-entries.x lines 247-262; `enum
#     AssetType` — lines 24-30.
#   * `enum LedgerEntryType` — Stellar-ledger-entries.x lines 92-104;
#   * `struct LedgerEntry` (lastModifiedLedgerSeq, the data union and the ext
#     union) — lines 548-586.
#
# Malformation rule (documented, deterministic):
# the crate-produced `TRUSTLINE` entry with exactly one field changed: the
# `TrustLineAsset` discriminant at offset 44 is set from
# `ASSET_TYPE_CREDIT_ALPHANUM4` (1) to 9, which `enum AssetType` does not
# define (0-3). Every other byte is unchanged.
#
# Generated and checked on 2026-10-22 (UTC) with the official `stellar-xdr
# 28.0.1` crate (features base64 and alloc — the crate version Protocol-
# Canary's canary-xdr pins for Protocol 28; rustc 1.99.1 (58cf8f9c3
# 2026-10-13)): LedgerEntry::from_xdr_base64 returns Err ("xdr value invalid")
# for this input, while the unmodified crate-produced encoding it was derived
# from decodes and round-trips successfully with the same crate. The source
# value was built by a program using the pinned crate, with the expression
# recorded in p28-xdr-ledger-entry-trustline.toml's header; the mutation above
# is the only change. The rest of the entry is well-formed, so the rejection
# is the unrecognised union discriminant rather than a truncation.
#
# Every byte is a synthetic structural value, not a capture of a real ledger
# entry, and nothing here was observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-ledger-entries.x

