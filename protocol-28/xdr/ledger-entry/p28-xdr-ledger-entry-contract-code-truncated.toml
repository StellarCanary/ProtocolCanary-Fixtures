category = "ledger-entry"
description = "A truncated `CONTRACT_CODE` code blob is correctly rejected, not silently accepted"
source_reference = "https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-ledger-entries.x"

