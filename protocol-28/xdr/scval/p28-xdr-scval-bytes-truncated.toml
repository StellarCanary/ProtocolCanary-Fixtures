# Protocol 28 / ScVal: a truncated `SCV_BYTES` payload is rejected.
#
# Complements p28-xdr-scval-bytes-small.toml: a decoder that accepts malformed
# input is as much of a compatibility break as one that rejects valid input,
# because two different byte strings would then decode to the same value and
# "roundtrip byte identity" would stop meaning anything.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `typedef opaque SCBytes<>;` — Stellar-contract.x line 9; `case SCV_BYTES:
#     SCBytes bytes;` — lines 296-297.
#   * `enum SCValType` — Stellar-contract.x lines 26-81;
#   * `union SCVal` — Stellar-contract.x lines 254-316.
#
# Malformation rule (documented, deterministic):
# the crate-produced 16-byte `ScVal::Bytes` (the five bytes `00 01 02 03 fe`
# plus padding) cut to its first 10 bytes. The length prefix still says 5, but
# only 2 payload bytes remain, so the length cannot be satisfied.
#
# Generated and checked on 2026-10-22 (UTC) with the official `stellar-xdr
# 28.0.1` crate (features base64 and alloc — the crate version Protocol-
# Canary's canary-xdr pins for Protocol 28; rustc 1.99.1 (58cf8f9c3
# 2026-10-13)): ScVal::from_xdr_base64 returns Err ("failed to fill whole
# buffer") for this input, while the unmodified crate-produced encoding it was
# derived from decodes and round-trips successfully with the same crate. The
# source value was built by a program using the pinned crate, with the
# expression recorded in p28-xdr-scval-bytes-small.toml's header; the mutation
# above is the only change. This is the length-prefix case the negative plan
# calls for: the decoder must check the remaining bytes before slicing, not
# trust the prefix.
#
# Every byte is a synthetic structural value, not a capture of a real network
# object, and nothing here was observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x

id = "p28-xdr-scval-bytes-truncated"
protocol = 28
surface = "xdr"
category = "scval"
description = "A truncated `ScVal::Bytes` payload is correctly rejected, not silently accepted"
source_reference = "https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x"

type = "ScVal"
kind = "decode-failure"
value_base64 = "AAAADQAAAAUAAQ=="
