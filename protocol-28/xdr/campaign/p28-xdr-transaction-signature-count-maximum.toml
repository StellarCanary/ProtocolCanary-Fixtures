# Protocol 28 / TransactionEnvelope: the maximum V1 signature vector round-trips.
#
# What this tests:
# An ENVELOPE_TYPE_TX envelope whose `TransactionV1Envelope.signatures` vector
# contains exactly 20 decorated signatures, the declared maximum. Every
# transaction field is identical to the reference-only
# `p28-xdr-transaction-envelope-v1-roundtrip` baseline; only the signature
# vector changes, from one element to twenty copies of that element.
#
# Why it matters: the empty-vector case exercises the lower boundary and the
# baseline exercises one element, but neither proves that the declared upper
# bound is accepted. A decoder that rejects the twentieth element or re-encode
# drops one of the copies would fail this fixture.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `struct TransactionV1Envelope` — Stellar-transaction.x lines 967-973;
#   * `DecoratedSignature signatures<20>` in that struct;
#   * `struct DecoratedSignature` — Stellar-transaction.x lines 33-37;
#   * `union TransactionEnvelope` — Stellar-transaction.x lines 1001-1010.
#
# Expected result and where it comes from: kind = "roundtrip" means the value
# must decode and re-encode byte for byte. The payload was generated with the
# official `stellar-xdr` 28.0.1 crate (features base64, alloc and std),
# rustc 1.98.1 (48a229cea 2026-09-01), on 2026-11-22 (UTC), by building the
# typed value below and serialising it with to_xdr_base64(Limits::none()):
#
#   let signature = DecoratedSignature {
#       hint: SignatureHint([0x66; 4]),
#       signature: Signature(BytesM::try_from(vec![0x66; 64]).unwrap()),
#   };
#   let signatures: Vec<DecoratedSignature> = (0..20).map(|_| signature.clone()).collect();
#   TransactionEnvelope::Tx(TransactionV1Envelope {
#       tx: Transaction {
#           source_account: MuxedAccount::Ed25519(Uint256([0x44; 32])),
#           fee: 100_000,
#           seq_num: SequenceNumber(2_345_678),
#           cond: Preconditions::None,
#           memo: Memo::None,
#           operations: vec![Operation {
#               source_account: None,
#               body: OperationBody::Payment(PaymentOp {
#                   destination: MuxedAccount::Ed25519(Uint256([0x55; 32])),
#                   asset: Asset::Native,
#                   amount: 2_000,
#               }),
#           }].try_into().unwrap(),
#           ext: TransactionExt::V0,
#       },
#       signatures: signatures.try_into().unwrap(),
#   })
#
# The same crate decoded the 1568-byte encoding, compared the decoded value to
# the constructed value, and reproduced the bytes exactly.
#
# Is it deterministic: Yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes.
#
# Every byte is a synthetic structural value, not a capture of a real network
# object. The repeated 0x66-filled hints and signatures are not signatures
# made by any key (no secret key is used anywhere); the account keys are
# placeholders and the fee, sequence number and amount are arbitrary fixed
# numbers.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-transaction.x

id = "p28-xdr-transaction-signature-count-maximum"
protocol = 28
surface = "xdr"
category = "transaction-envelope"
description = "A TransactionV1Envelope with the maximum 20 decorated signatures round-trips byte-for-byte"
source_reference = "https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-transaction.x"

type = "TransactionEnvelope"
