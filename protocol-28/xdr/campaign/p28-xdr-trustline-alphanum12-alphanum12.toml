# Protocol 28 / LedgerEntry: a `TRUSTLINE` entry with an AlphaNum12 asset round-trips.
#
# What this tests:
# a `TRUSTLINE` ledger entry: `lastModifiedLedgerSeq` 1_234_568, the
# `TRUSTLINE` discriminant (1), and a `TrustLineEntry` for a synthetic account
# holding an `ASSET_TYPE_CREDIT_ALPHANUM12` asset with the fixed 12-byte code
# `ABCDEFGHIJKL` and a synthetic issuer, balance 25_000_000, limit `i64::MAX`,
# flags 1 and the V0 ext arm.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `struct TrustLineEntry` — Stellar-ledger-entries.x lines 276-307; `union
#     TrustLineAsset` — lines 247-262; `enum AssetType` — lines 24-30; `struct
#     AlphaNum12` — lines 49-53; `typedef opaque AssetCode12[12]` — line 22;
#     `typedef PublicKey AccountID` — Stellar-types.x line 85.
#   * `enum LedgerEntryType` — Stellar-ledger-entries.x lines 92-104;
#   * `struct LedgerEntry` (lastModifiedLedgerSeq, the data union and the ext
#     union) — lines 548-586.
#
# Why it matters:
# `ASSET_TYPE_CREDIT_ALPHANUM12` (2) has a fixed 12-byte code before the issuer
# key, unlike AlphaNum4's 4-byte code. A decoder that reads the wrong width
# shifts the issuer and every later trustline field, changing which asset the
# line is for — a value-integrity failure, not a formatting one.
#
# Expected result and where it comes from: kind = "roundtrip" means a decoder
# must accept this entry and re-encoding it must reproduce value_base64 byte for
# byte, not merely an equal value. The payload was produced by a program that
# builds the typed value with the official `stellar-xdr 28.0.1` crate (features
# base64, alloc and std) and serialises it with
# to_xdr_base64(Limits::none()), never hand-assembled. Generation expression,
# recorded verbatim:
#
#   LedgerEntry { last_modified_ledger_seq: 1_234_568, data: LedgerEntryData::Trustline(TrustLineEntry { account_id: AccountId(PublicKey::PublicKeyTypeEd25519(Uint256([0x33; 32]))), asset: TrustLineAsset::CreditAlphanum12(AlphaNum12 { asset_code: AssetCode12(*b"ABCDEFGHIJKL"), issuer: AccountId(PublicKey::PublicKeyTypeEd25519(Uint256([0x44; 32]))) }), balance: 25_000_000, limit: i64::MAX, flags: 1, ext: TrustLineEntryExt::V0 }), ext: LedgerEntryExt::V0 }
#
# Crate: stellar-xdr 28.0.1; rustc 1.98.1 (48a229cea 2026-09-01); generated
# 2026-11-24 (UTC). The same program asserted the crate's own round trip:
# from_xdr returned Ok and re-encoding the decoded value reproduced the
# encoding exactly.
#
# Is it deterministic: yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes.
#
# Every payload byte is a synthetic structural value, not a capture of a real
# ledger entry and not an account, trustline or balance that exists on any
# network: the 0x33-filled account id and 0x44-filled issuer are fixed
# placeholders, no secret key is used or represented anywhere, and the balance,
# flags and ledger number are arbitrary constants. Nothing here was observed on
# a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-ledger-entries.x

