# Protocol 28 / TransactionEnvelope: an empty operations vector (0 operations) round-trips.
#
# What this tests:
# Embeds an empty operations list (`VecM::default()`, length 0) into a Protocol 28
# TransactionEnvelope V1 (ENVELOPE_TYPE_TX). The baseline fixture contains one Payment
# operation; this fixture tests the lower boundary of the operations vector length (0 operations).
#
# Why it matters:
# `Transaction.operations` is defined as `Operation operations<MAX_OPS_PER_TX>` where
# `MAX_OPS_PER_TX = 100`. An empty operations vector is valid XDR for a transaction structure.
# Decoders must handle empty operation lists without assuming at least one operation is present
# and must roundtrip the empty vector cleanly.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `union TransactionEnvelope` — Stellar-transaction.x lines 1001-1010;
#   * `struct TransactionV1Envelope` — Stellar-transaction.x lines 967-973;
#   * `struct Transaction` — Stellar-transaction.x lines 932-965;
#   * `const MAX_OPS_PER_TX = 100` — Stellar-transaction.x line 12;
#   * `struct Operation` — Stellar-transaction.x lines 653-719;
#   * `union MuxedAccount` — Stellar-transaction.x lines 20-31;
#   * `struct DecoratedSignature` — Stellar-transaction.x lines 33-37.
#
# Expected result and where it comes from: kind = "roundtrip" means a decoder must
# accept this value and re-encoding it must reproduce value_base64 byte for byte,
# not merely an equal value.
#
# The payload was produced by building the typed value with the official
# `stellar-xdr 28.0.1` crate (features base64, alloc and std — the crate version
# Protocol-Canary's canary-xdr pins for Protocol 28; rustc 1.99.0)
# on 2026-11-21 (UTC) and serializing it with WriteXdr::to_xdr_base64(Limits::none()),
# never hand-assembled.
#
# Generation expression, recorded verbatim:
#
#   TransactionEnvelope::Tx(TransactionV1Envelope {
#       tx: Transaction {
#           source_account: MuxedAccount::Ed25519(Uint256([0x44; 32])),
#           fee: 100_000,
#           seq_num: SequenceNumber(2_345_678),
#           cond: Preconditions::None,
#           memo: Memo::None,
#           operations: vec![].try_into().unwrap(),
#           ext: TransactionExt::V0,
#       },
#       signatures: vec![DecoratedSignature {
#           hint: SignatureHint([0x66; 4]),
#           signature: Signature(BytesM::try_from(vec![0x66; 64]).unwrap()),
#       }].try_into().unwrap(),
#   }).to_xdr_base64(Limits::none())
#
# The same crate round-tripped the value: TransactionEnvelope::from_xdr_base64
# followed by to_xdr reproduced the 144-byte encoding exactly, byte for byte.
#
# Is it deterministic: Yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes.
#
# Synthetic structural values: the empty operations list demonstrates XDR representation only.
# It does not claim the transaction is valid for execution or accepted by a network.
# Construct the complete envelope with typed official XDR values. Keep expected bytes and
# evidence tied to the pinned crate and schema.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-transaction.x

id = "p28-xdr-transaction-operation-count-empty"
