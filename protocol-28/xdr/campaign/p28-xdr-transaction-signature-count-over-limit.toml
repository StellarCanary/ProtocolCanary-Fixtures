# Protocol 28 / TransactionEnvelope: a 21-element V1 signature vector is rejected.
#
# What this tests:
# A single, documented mutation of the accepted maximum-signature fixture:
# the four-byte word at byte offset 124, which is the
# `TransactionV1Envelope.signatures` length prefix, is changed from 20 to 21.
# All other bytes are identical to
# `p28-xdr-transaction-signature-count-maximum`.
#
# Why it matters: `signatures<20>` is a bounded vector. A decoder must reject
# an out-of-range length prefix before trying to read twenty-one elements.
# The official `stellar-xdr` 28.0.1 crate rejects this exact byte string with
# `xdr value max length exceeded`, which identifies the length limit.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `struct TransactionV1Envelope` — Stellar-transaction.x lines 967-973;
#   * `DecoratedSignature signatures<20>` in that struct;
#   * `struct DecoratedSignature` — Stellar-transaction.x lines 33-37;
#   * `union TransactionEnvelope` — Stellar-transaction.x lines 1001-1010.
#
# Expected result and where it comes from: kind = "decode-failure" means a
# decoder must reject the value. The accepted source value was generated with
# the official `stellar-xdr` 28.0.1 crate (features base64, alloc and std),
# rustc 1.98.1 (48a229cea 2026-09-01), on 2026-11-22 (UTC), from the typed
# expression recorded in the maximum-signature fixture. The rejected value is
# that accepted 1568-byte encoding after exactly one mutation:
#
#   let mut over = maximum.to_xdr(Limits::none()).unwrap();
#   assert_eq!(&over[124..128], &20u32.to_be_bytes());
#   over[124..128].copy_from_slice(&21u32.to_be_bytes());
#   assert!(TransactionEnvelope::from_xdr(&over, Limits::none()).is_err());
#
# The same crate confirmed the error text `xdr value max length exceeded`.
#
# Is it deterministic: Yes. The source encoding and mutation are fixed; no
# randomness, clock or network is used.
#
# Every byte is a synthetic structural value, not a capture of a real network
# object. No signature validity is claimed, and no key or secret is used.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-transaction.x

