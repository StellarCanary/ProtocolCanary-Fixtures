# Protocol 28 / TransactionEnvelope boundary: operations vector length exceeding maximum limit is rejected.
#
# What this tests:
# Replaces the 4-byte operations vector length prefix at byte offset 60 in the maximum-length
# fixture (which encodes 100 operations) with 101 (`0x00000065`).
# `MAX_OPS_PER_TX = 100` is the hard protocol limit on operations per transaction.
#
# Why it matters:
# A decoder that fails to validate vector length prefixes against `MAX_OPS_PER_TX` before
# allocating or reading operations would allow oversized transactions or experience out-of-bounds
# reads. Both the official crate and independent decoders must reject this encoding and identify
# the length or count limit violation.
#
# Malformation rule (documented, deterministic):
# Derived from `p28-xdr-transaction-operation-count-maximum.toml` (5,744 bytes).
# The four-byte word at byte offset 60 (the `operations` vector length count prefix) is mutated
# from 100 (`0x00000064`) to 101 (`0x00000065`). All preceding and succeeding bytes are unchanged.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `union TransactionEnvelope` — Stellar-transaction.x lines 1001-1010;
#   * `struct TransactionV1Envelope` — Stellar-transaction.x lines 967-973;
#   * `struct Transaction` — Stellar-transaction.x lines 932-965;
#   * `const MAX_OPS_PER_TX = 100` — Stellar-transaction.x line 12;
#   * `struct Operation` — Stellar-transaction.x lines 653-719.
#
# Expected result and where it comes from: kind = "decode-failure" means a decoder must
# reject this input during decoding. The official `stellar-xdr` crate rejects this payload with
# `Err(LengthExceedsMax)`, and the independent codec rejects it with:
# `operations length prefix 101 exceeds maximum 100`.
#
# Crate: official `stellar-xdr 28.0.1` (features base64, alloc and std); rustc 1.99.0;
# generated 2026-11-21 (UTC).
#
# Is it deterministic: Yes. The mutation is exact and reproducible.
#
# Synthetic structural values: demonstrates structural rejection boundary only.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-transaction.x

