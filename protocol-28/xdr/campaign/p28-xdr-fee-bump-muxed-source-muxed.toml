category = "transaction-envelope"
description = "A fee-bump envelope whose outer fee source is a muxed Ed25519 account round-trips byte-for-byte"
source_reference = "https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-transaction.x"

type = "TransactionEnvelope"
