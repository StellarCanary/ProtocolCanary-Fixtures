# Protocol 28 Soroban simulation smoke fixture.
#
# Builds and simulates a real, unsigned InvokeHostFunction transaction
# calling `name()` on the testnet Stellar Asset Contract for the native
# XLM asset (CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC), a
# reserved, network-wide, always-present contract address — nothing this
# repository deployed. `name` is part of the standard SEP-41 token
# interface and is a pure read with no authorization required, so
# simulation succeeds even with an arbitrary (unfunded) source account.
#
# This is a deliberately narrow Soroban fixture: it proves the full
# construction -> simulateTransaction -> result pipeline works against
# real Protocol 28 infrastructure. It does not exercise CAP-0085 or
# CAP-0086 host-function semantics specifically — see
# ../../docs/protocol-28.md for why those aren't covered by a fixture yet.
#
# Verified live against https://soroban-testnet.stellar.org on 2026-09-02
# by running `stellar-canary check --fixtures-dir protocol-28 --protocol 28
# --json` from a Protocol-Canary checkout: status "pass", observed network
# protocol 28, summary "simulation succeeded as expected".
#
# Reference: https://developers.stellar.org/docs/tokens/stellar-asset-contract

id = "p28-soroban-native-asset-name"
protocol = 28
surface = "soroban"
category = "smoke"
description = "simulateTransaction succeeds for a real Protocol 28 Soroban invocation (native asset contract name())"
source_reference = "https://developers.stellar.org/docs/tokens/stellar-asset-contract"

source_account = "GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF"
contract_id = "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
function = "name"
sequence_number = 1

[expect]
kind = "simulation-success"
